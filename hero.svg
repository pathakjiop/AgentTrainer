<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .grid-line { stroke: #262626; stroke-width: 1; stroke-dasharray: 4,4; }
      .axis { stroke: #404040; stroke-width: 1.5; }
      .bold-stroke { stroke: #FAFAFA; stroke-width: 2; fill: none; }
      .accent-stroke { stroke: #EF4444; stroke-width: 2.5; fill: none; }
      .accent-fill { fill: #EF4444; }
      .text-title { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 42px; fill: #FAFAFA; letter-spacing: -1px; text-transform: uppercase; }
      .text-sub { font-family: 'Work Sans', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #A3A3A3; letter-spacing: 3px; text-transform: uppercase; }
      .text-mono { font-family: 'Space Mono', Consolas, monospace; font-size: 11px; fill: #737373; letter-spacing: 1px; }
      .node-core { fill: #0A0A0A; stroke: #FAFAFA; stroke-width: 2; }
      .node-accent { fill: #EF4444; stroke: #0A0A0A; stroke-width: 2; }
    </style>
  </defs>

  <!-- Deep Stark Ground -->
  <rect width="1000" height="320" class="bg" />

  <!-- Outer Frame -->
  <rect x="16" y="16" width="968" height="288" fill="none" stroke="#262626" stroke-width="2" />
  <rect x="22" y="22" width="956" height="276" fill="none" stroke="#171717" stroke-width="1" />

  <!-- Coordinate Grid -->
  <line x1="60" y1="20" x2="60" y2="300" class="grid-line" />
  <line x1="320" y1="20" x2="320" y2="300" class="grid-line" />
  <line x1="580" y1="20" x2="580" y2="300" class="grid-line" />
  <line x1="840" y1="20" x2="840" y2="300" class="grid-line" />
  <line x1="20" y1="80" x2="980" y2="80" class="grid-line" />
  <line x1="20" y1="160" x2="980" y2="160" class="grid-line" />
  <line x1="20" y1="240" x2="980" y2="240" class="grid-line" />

  <!-- Corner Registry Marks -->
  <path d="M 28 40 L 40 40 M 40 28 L 40 40" stroke="#FAFAFA" stroke-width="2" fill="none" />
  <path d="M 972 40 L 960 40 M 960 28 L 960 40" stroke="#FAFAFA" stroke-width="2" fill="none" />
  <path d="M 28 280 L 40 280 M 40 292 L 40 280" stroke="#FAFAFA" stroke-width="2" fill="none" />
  <path d="M 972 280 L 960 280 M 960 292 L 960 280" stroke="#FAFAFA" stroke-width="2" fill="none" />

  <!-- Masthead Typography -->
  <text x="64" y="94" class="text-sub">ARCHITECTURE SPECIFICATION // REF. 01</text>
  <text x="62" y="146" class="text-title">AGENTTRAINER</text>
  <rect x="64" y="162" width="48" height="4" class="accent-fill" />

  <text x="64" y="196" class="text-sub" style="fill: #D4D4D4;">AUTONOMOUS AGENT RUNTIME &amp; EVALUATION CRUCIBLE</text>
  <text x="64" y="224" class="text-mono">GROUNDED RETRIEVAL // DETERMINISTIC SCORING // ZERO CODE EXECUTION</text>
  <text x="64" y="246" class="text-mono">COORDINATES: 40.7128 N, 74.0060 W // REVISION V1.0.0</text>

  <!-- Abstract Architectural Geometry (Right Side) -->
  <g transform="translate(680, 160)">
    <!-- Concentric Axes -->
    <circle cx="0" cy="0" r="105" stroke="#262626" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="75" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4" fill="none" />
    <circle cx="0" cy="0" r="45" stroke="#525252" stroke-width="1.5" fill="none" />

    <!-- Crosshair Lines -->
    <line x1="-125" y1="0" x2="125" y2="0" class="axis" />
    <line x1="0" y1="-125" x2="0" y2="125" class="axis" />

    <!-- Isometric Diamond Matrix -->
    <polygon points="0,-90 90,0 0,90 -90,0" class="bold-stroke" />
    <polygon points="0,-60 60,0 0,60 -60,0" stroke="#737373" stroke-width="1" fill="none" />
    <polygon points="0,-30 30,0 0,30 -30,0" class="accent-stroke" />

    <!-- Convergence Vectors -->
    <line x1="-90" y1="0" x2="0" y2="-90" stroke="#FAFAFA" stroke-width="2" />
    <line x1="0" y1="-90" x2="90" y2="0" stroke="#FAFAFA" stroke-width="2" />
    <line x1="90" y1="0" x2="0" y2="90" stroke="#FAFAFA" stroke-width="2" />
    <line x1="0" y1="90" x2="-90" y2="0" stroke="#FAFAFA" stroke-width="2" />

    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="-60" y1="60" x2="60" y2="-60" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Focal Nexus Nodes -->
    <circle cx="0" cy="0" r="6" class="accent-fill" />
    <circle cx="0" cy="-90" r="5" class="node-core" />
    <circle cx="90" cy="0" r="5" class="node-core" />
    <circle cx="0" cy="90" r="5" class="node-core" />
    <circle cx="-90" cy="0" r="5" class="node-core" />

    <circle cx="30" cy="0" r="3.5" class="node-accent" />
    <circle cx="-30" cy="0" r="3.5" class="node-accent" />
    <circle cx="0" cy="-30" r="3.5" class="node-accent" />
    <circle cx="0" cy="30" r="3.5" class="node-accent" />

    <!-- Vector Dimension Labels -->
    <text x="100" y="-8" class="text-mono" style="font-size: 9px; fill: #A3A3A3;">RAG.01</text>
    <text x="-135" y="-8" class="text-mono" style="font-size: 9px; fill: #A3A3A3;">EVAL.02</text>
    <text x="-24" y="-100" class="text-mono" style="font-size: 9px; fill: #A3A3A3;">OPT.03</text>
    <text x="-24" y="112" class="text-mono" style="font-size: 9px; fill: #A3A3A3;">DIST.04</text>
  </g>
</svg>
