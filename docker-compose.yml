services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agenttrainer
      POSTGRES_PASSWORD: agenttrainer
      POSTGRES_DB: agenttrainer
    ports: ["5432:5432"]
    volumes: [agenttrainer_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrainer -d agenttrainer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agenttrainer:agenttrainer@db:5432/agenttrainer
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  agenttrainer_pgdata:
